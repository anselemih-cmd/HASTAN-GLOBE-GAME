<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HASTAN GLOBE - Admin Login</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#eaf8f1,#eef8ff);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#172033;
}

.login-container{
width:100%;
max-width:420px;
}

.logo-box{
text-align:center;
margin-bottom:25px;
}

.logo{
display:inline-flex;
align-items:center;
justify-content:center;
position:relative;
height:65px;
white-space:nowrap;
}

.logo-h{
font-size:48px;
font-weight:900;
color:#f28c28;
}

.logo-astan{
font-size:36px;
font-weight:900;
color:#087443;
}

.logo-globe{
font-size:15px;
font-weight:900;
color:#087cca;
letter-spacing:2px;
position:absolute;
right:0;
top:-2px;
}

.login-card{
background:white;
border-radius:22px;
padding:28px 22px;
box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.admin-icon{
width:70px;
height:70px;
border-radius:20px;
background:#eaf8f1;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
margin:0 auto 15px;
}

h1{
text-align:center;
font-size:24px;
margin-bottom:7px;
}

.subtitle{
text-align:center;
color:#657080;
font-size:14px;
line-height:1.5;
margin-bottom:22px;
}

.form-group{
margin-top:14px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px;
}

input{
width:100%;
padding:14px;
border:1px solid #d7dfdc;
border-radius:11px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#087443;
box-shadow:0 0 0 3px rgba(8,116,67,.08);
}

.login-button{
width:100%;
padding:14px;
margin-top:18px;
border:0;
border-radius:11px;
background:#087443;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.login-button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
padding:12px;
border-radius:10px;
margin-top:14px;
font-size:13px;
line-height:1.5;
}

.error{
background:#fff0f0;
color:#c0392b;
}

.success{
background:#eaf8f1;
color:#087443;
}

.role-box{
display:none;
margin-top:10px;
padding:12px;
border-radius:10px;
font-size:13px;
font-weight:bold;
text-align:center;
}

.main-role{
background:#eaf8f1;
color:#087443;
}

.payment-role{
background:#fff7e6;
color:#b45309;
}

.uid-box{
display:none;
margin-top:15px;
padding:13px;
background:#f5f8f7;
border-radius:10px;
font-size:12px;
word-break:break-all;
}

.uid-box strong{
color:#087443;
}

.admin-info{
margin-top:18px;
padding:13px;
background:#f5f8f7;
border-radius:11px;
font-size:12px;
color:#657080;
line-height:1.5;
}

.back-button{
display:block;
width:100%;
text-align:center;
margin-top:15px;
padding:12px;
border-radius:10px;
background:#eef8ff;
color:#0757b5;
text-decoration:none;
font-weight:bold;
font-size:14px;
}

</style>

</head>

<body>

<div class="login-container">

<div class="logo-box">

<div class="logo">

<span class="logo-h">H</span>

<span class="logo-astan">ASTAN</span>

<span class="logo-globe">GLOBE</span>

</div>

</div>


<div class="login-card">

<div class="admin-icon">
🔐
</div>

<h1>
HASTAN GLOBE Admin Login
</h1>

<p class="subtitle">
Main Admin & Payment Admin Administration
</p>


<div class="form-group">

<label>Admin Email</label>

<input
id="adminEmail"
type="email"
placeholder="Enter admin email"
autocomplete="username"
>

</div>


<div class="form-group">

<label>Password</label>

<input
id="adminPassword"
type="password"
placeholder="Enter admin password"
autocomplete="current-password"
>

</div>


<button
id="loginButton"
class="login-button"
>

🔐 Login

</button>


<div id="errorMessage" class="message error"></div>

<div id="successMessage" class="message success"></div>

<div id="roleBox" class="role-box"></div>


<div id="uidBox" class="uid-box">

<strong>Authenticated UID:</strong>

<br>

<span id="authenticatedUid">--</span>

</div>


<div class="admin-info">

<strong>Security check:</strong><br>

Only authorized HASTAN GLOBE Admin accounts
configured in this system will be accepted.

</div>


<a href="index.html" class="back-button">
← Back to HASTAN GLOBE
</a>

</div>

</div>


<script type="module">

import { auth }
from "./firebase-config.js";

import {
signInWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ================================
   AUTHORIZED ADMIN UIDs
================================ */

const MAIN_ADMIN_UID =
"FkMOO6jsgJZvnJV36sl3RrHLd063";

const PAYMENT_ADMIN_UID =
"bRcIg5YO4ZheYcF9wlqI9K1Bphq2";


/* ================================
   ELEMENTS
================================ */

const emailInput =
document.getElementById("adminEmail");

const passwordInput =
document.getElementById("adminPassword");

const loginButton =
document.getElementById("loginButton");

const errorMessage =
document.getElementById("errorMessage");

const successMessage =
document.getElementById("successMessage");

const roleBox =
document.getElementById("roleBox");

const uidBox =
document.getElementById("uidBox");

const authenticatedUid =
document.getElementById("authenticatedUid");


/* ================================
   MESSAGE
================================ */

function showError(message){

errorMessage.textContent = message;

errorMessage.style.display = "block";

successMessage.style.display = "none";

roleBox.style.display = "none";

}


function showSuccess(message){

successMessage.textContent = message;

successMessage.style.display = "block";

errorMessage.style.display = "none";

}


/* ================================
   LOGIN
================================ */

async function adminLogin(){

const email =
emailInput.value.trim();

const password =
passwordInput.value;


errorMessage.style.display = "none";

successMessage.style.display = "none";

roleBox.style.display = "none";

uidBox.style.display = "none";


if(!email){

showError("Please enter the admin email.");

return;

}


if(!password){

showError("Please enter the admin password.");

return;

}


loginButton.disabled = true;

loginButton.textContent =
"Checking Account...";


try{

/*
Clear old sessions first
*/

localStorage.removeItem(
"hastan_admin_session"
);

localStorage.removeItem(
"hastan_admin_uid"
);

localStorage.removeItem(
"hastan_payment_admin_session"
);

localStorage.removeItem(
"hastan_payment_admin_uid"
);


/*
Firebase login
*/

const credential =
await signInWithEmailAndPassword(
auth,
email,
password
);


const user =
credential.user;


/*
IMPORTANT:
Use the UID returned directly
by Firebase.
*/

const uid =
user.uid;


console.log(
"HASTAN GLOBE LOGIN UID:",
uid
);


authenticatedUid.textContent =
uid;

uidBox.style.display =
"block";


/* ================================
   MAIN ADMIN
================================ */

if(uid === MAIN_ADMIN_UID){

localStorage.setItem(
"hastan_admin_session",
"true"
);

localStorage.setItem(
"hastan_admin_uid",
uid
);


roleBox.textContent =
"🔐 MAIN ADMIN";

roleBox.className =
"role-box main-role";

roleBox.style.display =
"block";


showSuccess(
"Main Admin verified. Opening Admin Dashboard..."
);


loginButton.textContent =
"Opening Main Admin...";


/*
Use replace instead of href
*/

setTimeout(() => {

window.location.replace(
"./admin.html"
);

}, 500);


return;

}


/* ================================
   PAYMENT ADMIN
================================ */

if(uid === PAYMENT_ADMIN_UID){

localStorage.setItem(
"hastan_payment_admin_session",
"true"
);

localStorage.setItem(
"hastan_payment_admin_uid",
uid
);


roleBox.textContent =
"💰 PAYMENT ADMIN";

roleBox.className =
"role-box payment-role";

roleBox.style.display =
"block";


showSuccess(
"Payment Admin verified. Opening Payment Dashboard..."
);


loginButton.textContent =
"Opening Payment Admin...";


setTimeout(() => {

window.location.replace(
"./payment-admin.html"
);

}, 500);


return;

}


/* ================================
   UNAUTHORIZED
================================ */

await signOut(auth);


showError(
"Access denied. This Firebase account is not an authorized HASTAN GLOBE Admin."
);


loginButton.disabled = false;

loginButton.textContent =
"🔐 Login";


}catch(error){

console.error(
"HASTAN GLOBE LOGIN ERROR:",
error
);


let message =
"Admin login failed.";


if(error.code === "auth/invalid-credential"){

message =
"Incorrect email or password.";

}

else if(error.code === "auth/user-not-found"){

message =
"No Firebase account was found with this email.";

}

else if(error.code === "auth/wrong-password"){

message =
"Incorrect password.";

}

else if(error.code === "auth/invalid-email"){

message =
"Please enter a valid email address.";

}

else if(error.code === "auth/too-many-requests"){

message =
"Too many login attempts. Please try again later.";

}

else if(error.code === "auth/network-request-failed"){

message =
"Network error. Check your internet connection.";

}

else{

message =
error.message || message;

}


showError(message);


loginButton.disabled = false;

loginButton.textContent =
"🔐 Login";

}

}


/* ================================
   BUTTON
================================ */

loginButton.addEventListener(
"click",
adminLogin
);


/* ================================
   ENTER KEY
================================ */

[emailInput,passwordInput].forEach(
input => {

input.addEventListener(
"keydown",
event => {

if(event.key === "Enter"){

adminLogin();

}

});

});


/* ================================
   DEBUG
================================ */

console.log(
"HASTAN GLOBE Admin Login Ready"
);

console.log(
"Main Admin:",
MAIN_ADMIN_UID
);

console.log(
"Payment Admin:",
PAYMENT_ADMIN_UID
);

</script>

</body>
</html>
